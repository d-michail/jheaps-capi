name: JHeaps master build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master 

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Windows 2022 - MSVC",
            os: windows-2022,
            cc: "cl",
            cxx: "cl",
            cmake-generator: "Visual Studio 17 2022"
          }
        - {
            name: "Ubuntu 22.04 - GCC",
            os: ubuntu-22.04,
            cc: "gcc",
            cxx: "g++"
          }
        - {
            name: "MacOS 14",
            os: macos-14,
            cc: "clang",
            cxx: "clang++",
          }
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Setup GraalVM
      id: setup-graalvm
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '21'
        distribution: 'graalvm-community'
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Set Windows ENV
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with: 
        arch: "x64"
    - name: Windows Run
      if: runner.os == 'Windows'
      shell: cmd
      env: 
        CMAKE_GENERATOR: ${{ matrix.config.cmake-generator }}
        CMAKE_GENERATOR_TOOLSET: host=x64
      run: |
        mkdir build
        cd build
        cmake ..
        cmake --build .
        ctest -C Debug .
    - name: Linux Run
      if: runner.os == 'Linux'
      shell: bash
      run: | 
        mkdir build
        cd build
        cmake .. -DCMAKE_C_COMPILER=${{ matrix.config.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }}
        make
        make test
    - name: MacOS Run
      if: runner.os == 'MacOS'
      shell: bash
      run: | 
        mkdir build
        cd build
        cmake .. -DCMAKE_C_COMPILER=${{ matrix.config.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }}
        make
        make test        
